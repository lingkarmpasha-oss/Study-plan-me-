<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Platform Pro</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F3F4F6;
            --text: #1F2937;
            --card-bg: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #D1D5DB;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #E5E7EB;
            padding: 10px;
            text-align: left;
        }
        th { background-color: #F9FAFB; }
        #app-content { display: none; } /* Hidden until logged in */
        .auth-container { max-width: 400px; margin: 100px auto; }
        .ai-chat-box {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #D1D5DB;
            padding: 10px;
            margin-bottom: 10px;
            background: #F9FAFB;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-section" class="card auth-container">
        <h2>Login ke Study Platform</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login / Daftar</button>
    </div>

    <div id="app-content">
        <header>
            <h1>📚 Study Platform Pro</h1>
            <button onclick="logout()" style="width: auto;">Logout</button>
        </header>

        <div class="grid">
            <div class="card">
                <h2>🗓️ Study Plan & Time Table</h2>
                <input type="text" id="materi" placeholder="Materi yang dipelajari">
                <input type="datetime-local" id="tenggat">
                <input type="url" id="link" placeholder="Link Pembelajaran (Opsional)">
                <input type="file" id="file-upload">
                <button onclick="tambahJadwal()">Tambah Jadwal</button>

                <table>
                    <thead>
                        <tr>
                            <th>Materi</th>
                            <th>Tenggat Waktu</th>
                            <th>Aksi/Link</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-jadwal">
                        </tbody>
                </table>
            </div>

            <div class="grid-column">
                <div class="card">
                    <h2>📝 Catatan (Notes)</h2>
                    <textarea id="catatan" rows="6" placeholder="Ketik catatan penting Anda di sini..."></textarea>
                    <button onclick="simpanCatatan()">Simpan Catatan</button>
                    <p id="notif-catatan" style="color: green; font-size: 12px; display: none;">Tersimpan!</p>
                </div>

                <div class="card">
                    <h2>🤖 Asisten Gemini AI</h2>
                    <div class="ai-chat-box" id="ai-response">
                        <em>Halo! Saya Gemini. Ada yang bisa saya bantu untuk belajarmu hari ini?</em>
                    </div>
                    <input type="text" id="ai-prompt" placeholder="Tanyakan sesuatu tentang materi Anda...">
                    <button onclick="tanyaGemini()">Tanya AI</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAf6OIJhVgdDtXE-68eF_P9dWnYj0a2gSo",
      authDomain: "study-plan-4560a.firebaseapp.com",
      projectId: "study-plan-4560a",
      storageBucket: "study-plan-4560a.firebasestorage.app",
      messagingSenderId: "87310568173",
      appId: "1:87310568173:web:1889cdd2f03767a18d9ae4",
      measurementId: "G-Y9G8GLX8E4"
    };
    
    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    // 2. KONFIGURASI GEMINI API
    const GEMINI_API_KEY = "Ab8RN6LdpgMly2dzPnYk07YtKQ4HJYMxwvs0tGtZfrU4wvspPQ";

    let currentUser = null;

    // --- AUTENTIKASI ---
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            muatData();
        } else {
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('app-content').style.display = 'none';
        }
    });

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
            await auth.signInWithEmailAndPassword(email, password);
        } catch (error) {
            // Jika akun belum ada, buat akun baru otomatis (untuk kemudahan)
            if (error.code === 'auth/user-not-found') {
                await auth.createUserWithEmailAndPassword(email, password);
            } else {
                alert("Error login: " + error.message);
            }
        }
    }

    function logout() {
        auth.signOut();
    }

    // --- FITUR JADWAL & UPLOAD FILE ---
    async function tambahJadwal() {
        const materi = document.getElementById('materi').value;
        const tenggat = document.getElementById('tenggat').value;
        const link = document.getElementById('link').value;
        const fileInput = document.getElementById('file-upload').files[0];
        
        if (!materi || !tenggat) return alert("Materi dan tenggat waktu wajib diisi!");

        let fileUrl = "";
        if (fileInput) {
            const storageRef = storage.ref(`files/${currentUser.uid}/${fileInput.name}`);
            await storageRef.put(fileInput);
            fileUrl = await storageRef.getDownloadURL();
        }

        db.collection('jadwal').add({
            uid: currentUser.uid,
            materi: materi,
            tenggat: tenggat,
            link: link,
            fileUrl: fileUrl,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('materi').value = "";
        document.getElementById('tenggat').value = "";
        document.getElementById('link').value = "";
        document.getElementById('file-upload').value = "";
    }

    function muatData() {
        // Muat Jadwal
        db.collection('jadwal').where('uid', '==', currentUser.uid).orderBy('timestamp', 'desc')
        .onSnapshot(snapshot => {
            const tabel = document.getElementById('tabel-jadwal');
            tabel.innerHTML = "";
            snapshot.forEach(doc => {
                const data = doc.data();
                const aksi = [];
                if (data.link) aksi.push(`<a href="${data.link}" target="_blank">Link</a>`);
                if (data.fileUrl) aksi.push(`<a href="${data.fileUrl}" target="_blank">File</a>`);
                
                tabel.innerHTML += `
                    <tr>
                        <td>${data.materi}</td>
                        <td>${new Date(data.tenggat).toLocaleString('id-ID')}</td>
                        <td>${aksi.join(' | ') || '-'} <button onclick="hapusJadwal('${doc.id}')" style="padding: 2px 5px; font-size: 12px; margin-top:5px; background:red;">Hapus</button></td>
                    </tr>
                `;
            });
        });

        // Muat Catatan
        db.collection('catatan').doc(currentUser.uid).get().then(doc => {
            if (doc.exists) {
                document.getElementById('catatan').value = doc.data().teks;
            }
        });
    }

    function hapusJadwal(id) {
        db.collection('jadwal').doc(id).delete();
    }

    // --- FITUR CATATAN ---
    function simpanCatatan() {
        const teks = document.getElementById('catatan').value;
        db.collection('catatan').doc(currentUser.uid).set({ teks: teks })
        .then(() => {
            const notif = document.getElementById('notif-catatan');
            notif.style.display = 'block';
            setTimeout(() => notif.style.display = 'none', 2000);
        });
    }

    // --- INTEGRASI GEMINI AI ---
    async function tanyaGemini() {
        const prompt = document.getElementById('ai-prompt').value;
        if (!prompt) return;

        const responseBox = document.getElementById('ai-response');
        responseBox.innerHTML += `<p><strong>Anda:</strong> ${prompt}</p>`;
        document.getElementById('ai-prompt').value = "";
        responseBox.innerHTML += `<p id="loading-ai"><em>Gemini sedang berpikir...</em></p>`;
        responseBox.scrollTop = responseBox.scrollHeight;

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            
            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            
            document.getElementById('loading-ai').remove();
            // Simple markdown parser to handle bold and line breaks from Gemini
            const formattedText = aiText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            responseBox.innerHTML += `<p><strong>Gemini:</strong> ${formattedText}</p>`;
            responseBox.scrollTop = responseBox.scrollHeight;

        } catch (error) {
            document.getElementById('loading-ai').remove();
            responseBox.innerHTML += `<p style="color:red;">Error: Gagal menghubungi AI. Pastikan API Key benar.</p>`;
        }
    }
</script>
</body>
</html>
