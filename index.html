<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Plan - Trial Version</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; }
        .hidden { display: none !important; }
        input[type="text"], input[type="password"], input[type="date"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; width: auto; padding: 5px 10px; margin: 0; }
        .btn-logout { background: #6c757d; margin-bottom: 20px; }
        ul { list-style: none; padding: 0; }
        li { background: #e9ecef; margin: 8px 0; padding: 12px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .completed { text-decoration: line-through; color: gray; }
        .badge { background: #28a745; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; margin-right: 10px; }
        .trial-warning { background: #ffeeba; color: #856404; padding: 10px; border-radius: 5px; text-align: center; font-size: 0.9em; margin-bottom: 15px; }
        .task-info { display: flex; flex-direction: column; gap: 5px; width: 70%; }
        .task-date { font-size: 0.8em; color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginSection">
        <h2>Login Study Plan</h2>
        <p style="font-size: 12px; text-align: center; color: gray;">
            Admin: <b>admin</b> | Pass: <b>admin123</b> <br>
            User biasa dibatasi 3 tugas (Versi Trial).
        </p>
        <input type="text" id="usernameInput" placeholder="Username">
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="login()">Masuk</button>
    </div>

    <div id="dashboardSection" class="hidden">
        <button class="btn-logout" onclick="logout()">Logout</button>
        <h2 id="welcomeMessage">Selamat Datang!</h2>
        
        <div id="trialBanner" class="trial-warning hidden">
            Anda menggunakan versi Trial. Sisa kuota plan: <span id="quotaCount">3</span>/3
        </div>
        
        <div id="userControls">
            <input type="text" id="taskInput" placeholder="Masukkan materi belajar...">
            <input type="date" id="dateInput">
            <button onclick="addPlan()">Tambah ke Study Plan</button>
        </div>

        <h3>Daftar Study Plan</h3>
        <ul id="planList"></ul>
    </div>
</div>

<script>
    let studyPlans = JSON.parse(localStorage.getItem('studyPlans')) || [];
    let currentUser = null;
    let isAdmin = false;
    const MAX_TRIAL_PLANS = 3;

    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const planList = document.getElementById('planList');
    const userControls = document.getElementById('userControls');
    const trialBanner = document.getElementById('trialBanner');
    const quotaCount = document.getElementById('quotaCount');

    function login() {
        const user = document.getElementById('usernameInput').value.trim();
        const pass = document.getElementById('passwordInput').value.trim();
        if (!user || !pass) return alert('Isi Username dan Password!');
        
        currentUser = user;
        isAdmin = (user === 'admin' && pass === 'admin123');
        document.getElementById('usernameInput').value = '';
        document.getElementById('passwordInput').value = '';
        showDashboard();
    }

    function logout() {
        currentUser = null;
        isAdmin = false;
        loginSection.classList.remove('hidden');
        dashboardSection.classList.add('hidden');
    }

    function showDashboard() {
        loginSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        document.getElementById('welcomeMessage').innerText = isAdmin ? 'Panel Admin' : 'Study Plan: ' + currentUser;
        
        if (isAdmin) {
            userControls.classList.add('hidden');
            trialBanner.classList.add('hidden');
        } else {
            userControls.classList.remove('hidden');
            trialBanner.classList.remove('hidden');
        }
        renderPlans();
    }

    function addPlan() {
        const task = document.getElementById('taskInput').value.trim();
        const date = document.getElementById('dateInput').value;
        if (!task || !date) return alert('Isi materi dan tanggal deadline!');

        const userPlansCount = studyPlans.filter(p => p.user === currentUser).length;
        if (!isAdmin && userPlansCount >= MAX_TRIAL_PLANS) {
            alert('Limit Trial Tercapai! Anda hanya bisa membuat 3 plan.');
            return;
        }

        studyPlans.push({ id: Date.now(), user: currentUser, task, date, completed: false });
        saveData();
        document.getElementById('taskInput').value = '';
        document.getElementById('dateInput').value = '';
        renderPlans();
    }

    function deletePlan(id) {
        studyPlans = studyPlans.filter(plan => plan.id !== id);
        saveData();
        renderPlans();
    }

    function toggleComplete(id) {
        const plan = studyPlans.find(p => p.id === id);
        if (plan) {
            plan.completed = !plan.completed;
            saveData();
            renderPlans();
        }
    }

    function saveData() {
        localStorage.setItem('studyPlans', JSON.stringify(studyPlans));
    }

    function renderPlans() {
        planList.innerHTML = '';
        const filteredPlans = isAdmin ? studyPlans : studyPlans.filter(p => p.user === currentUser);
        
        if (!isAdmin) {
            quotaCount.innerText = MAX_TRIAL_PLANS - filteredPlans.length;
        }

        if (filteredPlans.length === 0) {
            planList.innerHTML = '<li>Belum ada data.</li>';
            return;
        }

        filteredPlans.forEach(plan => {
            const li = document.createElement('li');
            const statusClass = plan.completed ? 'completed' : '';
            const adminBadge = isAdmin ? `<span class="badge">${plan.user}</span>` : '';
            const checked = plan.completed ? 'checked' : '';

            li.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px; width: 70%;">
                    <input type="checkbox" ${checked} onchange="toggleComplete(${plan.id})">
                    <div class="task-info">
                        <span class="${statusClass}">${adminBadge}${plan.task}</span>
                        <span class="task-date">Deadline: ${plan.date}</span>
                    </div>
                </div>
                <button class="btn-danger" onclick="deletePlan(${plan.id})">Hapus</button>
            `;
            planList.appendChild(li);
        });
    }
</script>

</body>
</html>
